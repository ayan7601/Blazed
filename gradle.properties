org.gradle.jvmargs=-Xmx2G
# off because loom's include-from-file task cannot be serialised into the config cache
org.gradle.configuration-cache=false

# Fabric Properties (https://fabricmc.net/develop)
# 26.x ships unobfuscated, so there is no yarn and no real intermediary.
# mappings come from loom.officialMojangMappings().
minecraft_version=26.1.2
loader_version=0.19.3
fabric_api_version=0.155.2+26.1.2

# meteor publishes 26.1.2 but baritone only publishes 26.1, so these cannot share a property
meteor_version=26.1.2
baritone_version=26.1

# Mod Properties
mod_version=26.1.2-n-17
maven_group=com.ayan7601
archives_base_name=blazed
mod_name=Blazed

# Allow Gradle to auto-download requested Java toolchains (used to obtain Java 25)
org.gradle.java.installations.auto-download=true
# Add local Java 25 installation path (from Downloads)
org.gradle.java.installations.paths=/home/ayan/Downloads/java-25-openjdk-25.0.4.0.7-1.0.portable.jdk.x86_64
